services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: mdal
      POSTGRES_PASSWORD: mdal
      POSTGRES_DB: mdal
    ports:
      - "5432:5432"
    volumes:
      - mdal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdal -d mdal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mdal_pgdata:
