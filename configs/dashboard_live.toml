# A second dashboard demo campaign: different strategy, longer per-run steps,
# so it stays visibly "running" (progress bar mid-flight, pending runs) for a
# while after launch instead of finishing in under a minute.
name = "dashboard_live"
observable = "pressure"
seed = 11

[domain]
temperature = [1.35, 3.0]
density = [0.05, 0.9]

[acquisition]
strategy = "max_variance"

[budget]
n_initial = 8
n_total = 80
batch = 8

[run_defaults]
n_particles = 864
n_steps = 45000
equil_steps = 8000
sample_interval = 100
timestep = 0.005
thermostat = "langevin"
friction = 1.0
cutoff = 2.5
tail_correction = true
