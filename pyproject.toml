[project]
name = "mdal"
version = "0.0.0"
description = "Molecular dynamics x active learning: simulation-campaign orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "duckdb>=1.0",
    "pymbar>=4.0",  # core: the estimator's autocorrelation/equilibration machinery
]

[project.optional-dependencies]
md = ["openmm>=8.2"]
surrogate = ["scikit-learn>=1.4"]
viz = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
