[project]
name = "mdal"
version = "0.0.0"
description = "Molecular dynamics x active learning: simulation-campaign orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "psycopg[binary]>=3.1",
    "pymbar>=4.0",  # core: the estimator's autocorrelation/equilibration machinery
]

[project.optional-dependencies]
md = ["openmm>=8.2"]
surrogate = ["scikit-learn>=1.4"]
viz = ["matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
mlflow = ["mlflow>=2.14"]  # campaign/loop.py, campaign/cost_aware_loop.py surrogate-fit tracking
migrate = ["duckdb>=1.0"]  # scripts/migrate_duckdb_to_postgres.py only
dl = ["torch>=2.2"]  # mdal.analysis.dl_surrogates only — deep-learning UQ baselines

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full-strength training runs (deep-learning surrogates) — deselected by default; run explicitly with `uv run pytest -m slow`",
]
